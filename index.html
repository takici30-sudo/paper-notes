<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small browser notebook with a safe, basic Markdown preview and file export.">
  <title>Paper Notes</title>
  <style>
    :root { color-scheme: light; --paper: #faf8f2; --ink: #233347; --muted: #627085; --line: #d9dedf; --accent: #3256b1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 "Trebuchet MS", sans-serif; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 5px; padding: 9px 15px; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .wrap { max-width: 1320px; margin: auto; padding: 28px 36px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    .brand { font: bold 22px Georgia, serif; letter-spacing: -.7px; }
    .brand span { display: inline-grid; place-items: center; background: var(--ink); color: var(--paper); width: 29px; height: 32px; margin-right: 10px; font: 18px Georgia, serif; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 38px 0 28px; }
    h1 { font: normal clamp(34px, 4vw, 52px)/1.1 Georgia, serif; letter-spacing: -.04em; margin: 0 0 12px; }
    .intro p { margin: 0; color: var(--muted); }
    #stats { font: 12px monospace; color: var(--muted); white-space: nowrap; }
    .notebook { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); background: white; border-radius: 8px; overflow: hidden; }
    .panel { min-width: 0; }
    .panel + .panel { border-left: 1px solid var(--line); }
    .panel-heading { display: flex; align-items: center; gap: 10px; padding: 13px 20px; background: #f0f2f1; border-bottom: 1px solid var(--line); font: 11px monospace; letter-spacing: .08em; text-transform: uppercase; }
    .panel-heading span { margin-left: auto; color: var(--muted); }
    label { cursor: text; }
    textarea { display: block; resize: vertical; width: 100%; min-height: 530px; border: 0; background: #fff; color: var(--ink); font: 14px/1.85 "Courier New", monospace; padding: 26px; border-radius: 0; }
    textarea:focus-visible { outline-offset: -3px; }
    #preview { padding: 20px 30px 40px; overflow-wrap: anywhere; }
    #preview h1, #preview h2, #preview h3 { font-family: Georgia, serif; line-height: 1.2; letter-spacing: -.025em; }
    #preview h1 { font-size: 32px; margin: 16px 0 24px; }
    #preview h2 { font-size: 24px; margin: 30px 0 14px; }
    #preview h3 { font-size: 19px; margin: 24px 0 12px; }
    #preview p { margin: 16px 0; white-space: pre-wrap; }
    #preview ul, #preview ol { padding-left: 22px; }
    #preview li { margin: 8px 0; }
    #preview blockquote { margin: 22px 0; padding: 8px 16px; border-left: 3px solid var(--accent); color: var(--muted); white-space: pre-wrap; }
    #preview pre { background: #f0f2f1; border-radius: 5px; padding: 18px; overflow-x: auto; color: var(--ink); }
    #preview code { font: 13px/1.7 "Courier New", monospace; }
    #preview hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
    #save-status { min-height: 22px; color: var(--muted); font-size: 12px; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 14px 0; color: var(--muted); font-size: 12px; }
    footer a { color: inherit; text-underline-offset: 4px; }
    @media (max-width: 760px) { .wrap { padding: 22px; } .notebook { grid-template-columns: 1fr; } .panel + .panel { border-left: 0; border-top: 1px solid var(--line); } textarea { min-height: 330px; } .intro { display: block; } #stats { display: block; margin-top: 20px; } header { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><span aria-hidden="true">p.</span>Paper Notes</div><button id="download" type="button">Download .md <span aria-hidden="true">↓</span></button></header>
    <main>
      <div class="intro"><div><h1>A place for your next idea.</h1><p>Write on the left. Watch your words take shape on the right.</p></div><output id="stats" for="editor"></output></div>
      <div class="notebook">
        <section class="panel"><div class="panel-heading"><label for="editor">Source</label><span>Basic Markdown</span></div><textarea id="editor" spellcheck="true" aria-describedby="save-status"></textarea></section>
        <section class="panel" aria-labelledby="preview-heading"><div class="panel-heading" id="preview-heading">Preview<span>Paper view</span></div><div id="preview"></div></section>
      </div>
      <p id="save-status" role="status" aria-live="polite"></p>
    </main>
    <footer><span>Local saving · Export a copy to keep it safe.</span><a href="https://github.com/takici30-sudo/paper-notes">View source</a></footer>
  </div>
  <script>
    const editor = document.querySelector('#editor');
    const preview = document.querySelector('#preview');
    const status = document.querySelector('#save-status');
    const key = 'paper-notes.document.v1';
    const sample = '# A small notebook\n\nGood ideas deserve a little space. This is a sample note; replace it with your own.\n\n## Things to explore\n\n- Build a tiny tool\n- Write down what you learn\n- Share something useful\n\n> Start small. Make it yours.\n\n## A little code\n\n```js\nconst idea = "something worth making";\n```\n\n---\n\nUse the Download button to save a Markdown copy.';
    editor.value = sample;
    try { editor.value = localStorage.getItem(key) ?? sample; }
    catch { status.textContent = 'Browser storage is unavailable. Download a copy before closing this tab.'; }
    function append(tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      preview.append(element);
      return element;
    }
    function render() {
      preview.replaceChildren();
      let inCode = false, code = [], list = null, paragraph = [];
      const flush = () => { if (paragraph.length) { append('p', paragraph.join('\n')); paragraph = []; } };
      const flushCode = () => { const pre = append('pre', ''); const element = document.createElement('code'); element.textContent = code.join('\n'); pre.append(element); code = []; };
      for (const line of editor.value.split('\n')) {
        if (/^\s*```/.test(line)) {
          flush(); list = null;
          if (inCode) flushCode();
          inCode = !inCode; continue;
        }
        if (inCode) { code.push(line); continue; }
        if (!line.trim()) { flush(); list = null; continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const item = line.match(/^\s*(?:[-*]\s+|\d+\.\s+)(.+)$/);
        if (heading) { flush(); list = null; append('h' + heading[1].length, heading[2]); }
        else if (item) {
          flush();
          const type = /^\s*\d+\./.test(line) ? 'ol' : 'ul';
          if (!list || list.tagName.toLowerCase() !== type) list = append(type, '');
          const li = document.createElement('li'); li.textContent = item[1]; list.append(li);
        }
        else if (/^>\s?/.test(line)) { flush(); list = null; append('blockquote', line.replace(/^>\s?/, '')); }
        else if (/^\s*---+\s*$/.test(line)) { flush(); list = null; append('hr', ''); }
        else { list = null; paragraph.push(line); }
      }
      flush();
      if (inCode) flushCode();
      const text = editor.value.trim();
      document.querySelector('#stats').textContent = (text ? text.split(/\s+/u).length : 0) + ' words · ' + Array.from(editor.value).length + ' characters';
    }
    let saveTimer;
    function save() {
      try { localStorage.setItem(key, editor.value); status.textContent = 'Saved in this browser.'; }
      catch { status.textContent = 'Could not save locally. Use Download to keep a copy of your note.'; }
    }
    editor.addEventListener('input', () => { render(); clearTimeout(saveTimer); status.textContent = 'Saving…'; saveTimer = setTimeout(save, 300); });
    window.addEventListener('pagehide', () => { clearTimeout(saveTimer); save(); });
    document.querySelector('#download').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([editor.value], { type: 'text/markdown;charset=utf-8' }));
      const link = document.createElement('a'); link.href = url; link.download = 'paper-note.md'; document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    render();
  </script>
</body>
</html>
